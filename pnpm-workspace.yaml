packages:
  - apps/mobile
  - apps/desktop
  - apps/shared

# 解析新版本时只用发布满 3 天（单位为分钟）的版本：被投毒的版本通常在几小时到几天内下架，范围版本跑 pnpm update 时同样生效。
# 等不了的安全修复临时加进 minimumReleaseAgeExclude，升级后删掉。
minimumReleaseAge: 4320

# 多个应用共用的运行时库，版本只在这里写一次，各 package.json 写 catalog:。
catalog:
  '@ant-design/icons': 6.3.4
  antd: 6.6.7
  qrcode.react: 4.2.0
  react: 18.3.1
  react-dom: 18.3.1

onlyBuiltDependencies:
  - esbuild

overrides:
  'xcode>uuid': 11.1.1
  # 同一主版本只保留一个版本。上游写死或用窄范围，pnpm dedupe 合并不了；
  # 跨主版本的旧版 API 不兼容，留给上游升级。
  '@rolldown/pluginutils@1.0.0-rc.3': 1.0.1
  'bplist-parser@0.3': 0.3.2
  'ci-info@4': 4.4.0
  'comment-parser@1': 1.4.9
  'fs-extra@11': 11.4.1
  'plist@3': 3.1.1
  'safe-buffer@5': 5.2.1
  'sax@1': 1.6.1
  'semver@7': 7.8.5
  'string_decoder@1': 1.3.0

peerDependencyRules:
  allowedVersions:
    # eslint-plugin-react 7.37 的 peer 范围还停在 ESLint 9；项目用到的规则在 ESLint 10 上能正常运行。
    'eslint-plugin-react>eslint': '10'
