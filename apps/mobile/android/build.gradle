// 顶层构建文件，用于配置所有子项目或模块共用的选项。

buildscript {

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'

        // 注意：应用依赖应放在各模块的 build.gradle 文件中，
        // 不要在此处声明。
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
