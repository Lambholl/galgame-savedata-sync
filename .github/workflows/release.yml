name: Release build

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # Linux 包在支持的最早 LTS 上构建，二进制要求的 glibc 不高于它的版本；产物交给下面的 release 一起发布。
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
      # patchelf 给 sidecar 预设 RUNPATH，见 apps/desktop/scripts/build-sidecar-exe.mjs。
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config file patchelf libssl-dev libxdo-dev librsvg2-dev libwebkit2gtk-4.1-dev
      # 和 Windows 一样不加 Rust 编译缓存，发布包里的宿主从源码完整编译。
      - run: rustup toolchain install stable --profile minimal
      - run: pnpm install --frozen-lockfile
      # tag 是否在 origin/master 上由 release 检查，这里只确认版本号能从 tag 推算出来。
      - run: node scripts/app-version.mjs
      - run: pnpm test
      - run: pnpm release:loopback
      - run: pnpm desktop:package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-packages
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: error
          retention-days: 1

  release:
    needs: linux
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      # 先确认签名 Secrets 齐全，fork 或新仓库未配置时不必等完整构建才失败；这里只检查是否为空。
      - name: Check Android signing secrets
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $missing = 'ANDROID_KEYSTORE_BASE64', 'ANDROID_STORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD' |
            Where-Object { -not [Environment]::GetEnvironmentVariable($_) }
          if ($missing) {
            throw "缺少 Android 签名 Secrets：$($missing -join '、')。配置方法见 docs/development.md 的「Android 签名」一节。"
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # 拉取全部历史和 master，供下面检查 tag 是否在 master 上。
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      # 这里不加 Rust 编译缓存：缓存由普通分支的 CI 写入，发布包里的宿主要从源码完整编译。
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - run: pnpm install --frozen-lockfile
      # 版本号来自 tag。只发布 master 上的提交，master 和 tag 要一起推送（git push --atomic origin master vX.Y.Z），
      # 或者先推送 master；只推送 tag 时这一步失败，推送 master 后重新运行即可。
      - name: Verify release tag
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/app-version.mjs
          if ($LASTEXITCODE -ne 0) { throw 'tag 不是 vX.Y.Z，或当前提交不是这个 tag 指向的提交' }
          git merge-base --is-ancestor HEAD origin/master
          if ($LASTEXITCODE -ne 0) { throw "$env:RELEASE_TAG 指向的提交不在 origin/master 上" }
      - run: pnpm check
      - run: pnpm test:all
      - run: pnpm release:loopback
      - run: pnpm desktop:package
      # 密钥只在这一步解码并交给 Gradle，构建后删除。
      - name: Build signed Android release
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SAVEDATA_SYNC_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          SAVEDATA_SYNC_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SAVEDATA_SYNC_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:SAVEDATA_SYNC_STORE_FILE = Join-Path $env:RUNNER_TEMP 'savedata-sync-release.jks'
          [IO.File]::WriteAllBytes($env:SAVEDATA_SYNC_STORE_FILE, [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
          try {
            pnpm android:build --release
            if ($LASTEXITCODE -ne 0) { throw 'Android release 构建失败' }
          } finally {
            Remove-Item -LiteralPath $env:SAVEDATA_SYNC_STORE_FILE -Force -ErrorAction SilentlyContinue
          }
          $sdk = if ($env:ANDROID_HOME) { $env:ANDROID_HOME } else { $env:ANDROID_SDK_ROOT }
          $apksigner = Get-ChildItem -Path (Join-Path $sdk 'build-tools') -Filter apksigner.bat -Recurse |
            Sort-Object { [version]$_.Directory.Name } | Select-Object -Last 1
          & $apksigner.FullName verify --print-certs apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if ($LASTEXITCODE -ne 0) { throw 'Android 安装包签名校验失败' }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-packages
          path: release-assets
      - name: Prepare release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_TAG.TrimStart('v')
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          foreach ($name in "SavedataSync-$version-x86_64.AppImage", "SavedataSync-$version-amd64.deb") {
            if (-not (Test-Path -LiteralPath "release-assets/$name")) { throw "缺少 Linux 产物 $name" }
          }
          foreach ($name in "SavedataSync-$version-Setup-x64.exe", "SavedataSync-$version-Portable-x64.zip") {
            Copy-Item -LiteralPath "apps/desktop/release/$name" -Destination "release-assets/$name"
          }
          Copy-Item -LiteralPath "apps/mobile/android/app/build/outputs/apk/release/app-release.apk" `
            -Destination "release-assets/SavedataSync-$version-Android.apk"
          $checksums = Get-ChildItem -LiteralPath release-assets -File |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }
          Set-Content -LiteralPath release-assets/SHA256SUMS.txt -Value $checksums -Encoding utf8NoBOM
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: savedata-sync-${{ github.ref_name }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_TAG.TrimStart('v')
          $tagRef = "refs/tags/$($env:RELEASE_TAG)"
          $tagType = (git cat-file -t $tagRef) | Out-String
          $title = ''
          if ($LASTEXITCODE -eq 0 -and $tagType.Trim() -eq 'tag') {
            $subject = (git for-each-ref $tagRef --format='%(contents:subject)') | Out-String
            if ($LASTEXITCODE -eq 0) {
              $title = $subject.Trim()
            }
          }
          if (-not $title) {
            $title = $version
          }
          $assets = Get-ChildItem -LiteralPath release-assets -File | ForEach-Object FullName
          gh release create $env:RELEASE_TAG @assets `
            --draft `
            --title $title `
            --generate-notes
